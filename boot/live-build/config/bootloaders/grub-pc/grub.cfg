# ==============================================================================
# RedBoot GRUB Bootloader Configuration
# ==============================================================================
set default="0"
set timeout=10

insmod all_video
insmod font
insmod gfxterm

set menu_color_normal=white/black
set menu_color_highlight=black/light-gray

menuentry "RedBoot Security Lab (Forensic / Read-Only Mode - Default)" {
    linux /live/vmlinuz boot=live components quiet splash noautomount noswap ro toram ---
    initrd /live/initrd.img
}

menuentry "RedBoot Security Lab (RAM Mode - Discard on Poweroff)" {
    linux /live/vmlinuz boot=live components quiet splash toram noautomount noswap ro ---
    initrd /live/initrd.img
}

menuentry "RedBoot Security Lab (Failsafe / Verbose Boot)" {
    linux /live/vmlinuz boot=live components memtest noautomount noswap ro verbose ---
    initrd /live/initrd.img
}
