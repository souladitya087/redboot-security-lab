# RedBoot Boot-Time Environment Configuration
# Applied during boot-time initialization

REDBOOT_VERSION="1.0.0"
REDBOOT_ENVIRONMENT="academic-lab"

# Forensic protections:
# Force read-only block devices (1 = enabled, 0 = disabled)
FORCE_READONLY_STORAGE=1

# Memory-only execution: do not configure or mount any swap space
DISABLE_SWAP=1

# Network interface mode (dhcp / isolated / offline)
DEFAULT_NETWORK_MODE="dhcp"

# Logging destination (memory tmpfs or /var/log)
LOG_TMPFS=1
LOG_PATH="/var/log/redboot"
